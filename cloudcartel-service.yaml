apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcartel
  labels:
    app: cloudcartel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudcartel
  template:
    metadata:
      labels:
        app: cloudcartel
    spec:
      containers:
      - name: cloudcartel
        image: incognnnitamooood/cloudcartel:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcartel-service
  labels:
    app: cloudcartel
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: cloudcartel
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudcartel-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"        # Traefik Ingress class
spec:
  rules:
  - host: cloudcartel.duckdns.org                 # Your DuckDNS domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudcartel-service
            port:
              number: 80
